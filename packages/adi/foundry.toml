[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200
eth_rpc_url = "https://sepolia.base.org"
chain_id = 84532
gas_limit = "30000000"

[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
adl_testnet = "https://rpc.ab.testnet.adifoundation.ai"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
adl_testnet = { key = "empty", url = "https://explorer.ab.testnet.adifoundation.ai/" }
